            - uuid: 7d54c757ce8f4b6eb75b470431aa31f5
              name: 'PgBouncer server {#PGBOUNCER_USER}: active connections'
              type: DEPENDENT
              key: 'pgbouncer.pools.sv_active[{#PGBOUNCER_DATABASE},{#PGBOUNCER_USER}]'
